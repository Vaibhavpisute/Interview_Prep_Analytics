# Temporary helper: creates renv.lock from the R scripts (R is not installed on the dev machine).
name: renv bootstrap

on:
  workflow_dispatch:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libcurl4-openssl-dev libssl-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
      - name: Create renv.lock
        run: Rscript -e 'install.packages("renv"); renv::init()'
      - uses: actions/upload-artifact@v4
        with:
          name: renv-files
          include-hidden-files: true
          path: |
            renv.lock
            .Rprofile
            renv/activate.R
            renv/settings.json
            renv/.gitignore
