name: Weekly report

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Load, score (fake LLM) and check the sample data
        run: ipa demo --reset
      - name: Build the Excel report
        env:
          DATABASE_URL: sqlite:///data/demo.db
        run: ipa weekly-report --out output/weekly_report.xlsx
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: output/weekly_report.xlsx
