name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipa
          POSTGRES_PASSWORD: ipa
          POSTGRES_DB: ipa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipa -d ipa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=ipa --cov-report=term-missing --cov-fail-under=80 | tee coverage.txt
      - name: Demo on SQLite (fake LLM, no API key)
        run: ipa demo --reset
      - name: Demo on PostgreSQL
        run: ipa demo --reset --db postgresql+psycopg://ipa:ipa@localhost:5432/ipa
      - name: Upload coverage and sample report
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-report
          path: |
            coverage.txt
            output/weekly_report.xlsx

  docker:
    name: Docker compose demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up runs the demo
        run: docker compose up --build --exit-code-from app --abort-on-container-exit
