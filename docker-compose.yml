# `docker compose up` starts PostgreSQL and runs the offline demo against it.
# Add `--profile dashboard` to also start the Streamlit dashboard on http://localhost:8501
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ipa
      POSTGRES_PASSWORD: ipa
      POSTGRES_DB: ipa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipa -d ipa"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["ipa", "demo", "--reset", "--db", "postgresql+psycopg://ipa:ipa@db:5432/ipa"]
    volumes:
      - ./output:/app/output

  dashboard:
    build: .
    profiles: ["dashboard"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ipa:ipa@db:5432/ipa
    command: ["streamlit", "run", "src/ipa/dashboard/app.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"

volumes:
  pgdata:
